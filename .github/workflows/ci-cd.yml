name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      provision_aws:
        description: "Create/update AWS EC2 infrastructure with Terraform"
        required: false
        default: false
        type: boolean

concurrency:
  group: mizan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mizan-backend
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mizan_test
      USE_LOCAL_DATABASE: "false"
      SECRET_KEY: ci-secret-key-that-is-long-enough-for-tests-only
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      MISTRAL_API_KEY: ""
      CLOUDINARY_CLOUD_NAME: ""
      CLOUDINARY_API_KEY: ""
      CLOUDINARY_API_SECRET: ""
      BACKEND_CORS_ORIGINS: http://localhost:3000
      ENABLE_SCHEDULER: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mizan-backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app main.py tests

      - name: Run backend tests
        run: python -m pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mizan-frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/voice/realtime
      NEXT_PUBLIC_AI_VOICE_VOLUME: "1"
      NEXT_PUBLIC_AI_VOICE_BOOST: "1.8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mizan-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mizan-mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mizan-mobile-app/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Typecheck mobile app
        run: npm run typecheck

  provision_aws:
    name: Provision AWS infrastructure
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.provision_aws
    defaults:
      run:
        working-directory: infra/aws
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_ssh_public_key: ${{ secrets.AWS_SSH_PUBLIC_KEY }}
      TF_VAR_ssh_allowed_cidr: ${{ secrets.AWS_SSH_ALLOWED_CIDR }}
    steps:
      - name: Check AWS provisioning secrets
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$AWS_REGION" ] || [ -z "$TF_VAR_ssh_public_key" ] || [ -z "$TF_VAR_ssh_allowed_cidr" ]; then
            echo "Missing AWS provisioning secrets." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve

      - name: Show server IP
        run: terraform output public_ip

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - mobile
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      ENV_COMPOSE_BASE64: ${{ secrets.ENV_COMPOSE_BASE64 }}
      DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
    steps:
      - name: Check deploy configuration
        id: deploy_config
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PATH" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$ENV_COMPOSE_BASE64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped because one or more deploy secrets are missing."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Start SSH agent
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy with Docker Compose
        if: steps.deploy_config.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail
            if [ -d '$DEPLOY_PATH/.git' ]; then
              cd '$DEPLOY_PATH'
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf '$DEPLOY_PATH'
              git clone 'https://github.com/${{ github.repository }}.git' '$DEPLOY_PATH'
              cd '$DEPLOY_PATH'
            fi
          "
          printf '%s' "$ENV_COMPOSE_BASE64" | ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "base64 -d > '$DEPLOY_PATH/.env.compose'"
          ssh -o StrictHostKeyChecking=accept-new -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail
            cd '$DEPLOY_PATH'
            docker compose --env-file .env.compose up -d --build
            docker compose --env-file .env.compose exec -T backend alembic current
          "

      - name: Health check
        if: steps.deploy_config.outputs.enabled == 'true' && env.DEPLOY_HEALTH_URL != ''
        run: curl -fsS "$DEPLOY_HEALTH_URL"
