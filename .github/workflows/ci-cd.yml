name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      aws_action:
        description: "AWS action to run"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy

concurrency:
  group: mizan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.aws_action == 'destroy') }}
    defaults:
      run:
        working-directory: mizan-backend
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mizan_test
      USE_LOCAL_DATABASE: "false"
      SECRET_KEY: ci-secret-key-that-is-long-enough-for-tests-only
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      MISTRAL_API_KEY: ""
      CLOUDINARY_CLOUD_NAME: ""
      CLOUDINARY_API_KEY: ""
      CLOUDINARY_API_SECRET: ""
      BACKEND_CORS_ORIGINS: http://localhost:3000
      ENABLE_SCHEDULER: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mizan-backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app main.py tests

      - name: Run backend tests
        run: python -m pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.aws_action == 'destroy') }}
    defaults:
      run:
        working-directory: mizan-frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/voice/realtime
      NEXT_PUBLIC_AI_VOICE_VOLUME: "1"
      NEXT_PUBLIC_AI_VOICE_BOOST: "1.8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mizan-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  deploy_aws:
    name: Deploy AWS
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.aws_action == 'deploy') }}
    env:
      AWS_DEPLOY_ENABLED: ${{ secrets.AWS_DEPLOY_ENABLED }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ secrets.TF_STATE_KEY }}
      TF_STATE_REGION: ${{ secrets.TF_STATE_REGION }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'mizan' }}
      TF_VAR_environment: ${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}
      TF_VAR_backend_image_tag: ${{ github.sha }}
      TF_VAR_frontend_image_tag: ${{ github.sha }}-bootstrap
      TF_VAR_backend_secret_key: ${{ secrets.BACKEND_SECRET_KEY }}
      TF_VAR_mistral_api_key: ${{ secrets.MISTRAL_API_KEY }}
      TF_VAR_cloudinary_cloud_name: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      TF_VAR_cloudinary_api_key: ${{ secrets.CLOUDINARY_API_KEY }}
      TF_VAR_cloudinary_api_secret: ${{ secrets.CLOUDINARY_API_SECRET }}
      TF_VAR_smtp_user: ${{ secrets.SMTP_USER }}
      TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
      APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
    steps:
      - name: Check AWS deploy configuration
        id: deploy_config
        run: |
          if [ "$AWS_DEPLOY_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS deployment skipped because AWS_DEPLOY_ENABLED is not true."
            exit 0
          fi
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$AWS_REGION" ] || [ -z "$TF_STATE_BUCKET" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS deployment skipped because AWS credentials or TF_STATE_BUCKET are missing."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Prepare custom domain terraform vars
        if: steps.deploy_config.outputs.enabled == 'true'
        run: |
          if [ -n "$APP_PUBLIC_URL" ]; then
            DOMAIN="$(printf '%s' "$APP_PUBLIC_URL" | sed -e 's#^https://##' -e 's#^http://##' -e 's#/.*##')"
            echo "TF_VAR_app_domain=${DOMAIN}" >> "$GITHUB_ENV"
            echo "Using custom frontend domain: ${DOMAIN} (API stays on CloudFront)"
          fi

      - name: Checkout
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Set up Node
        if: steps.deploy_config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mizan-frontend/package-lock.json

      - name: Create Terraform backend config
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: infra/aws
        run: |
          cat > backend_override.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF

      - name: Terraform init
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: infra/aws
        run: |
          KEY="${TF_STATE_KEY:-mizan/staging/terraform.tfstate}"
          REGION="${TF_STATE_REGION:-$AWS_REGION}"
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$KEY" \
            -backend-config="region=$REGION"

      - name: Bootstrap ECR repositories
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: infra/aws
        run: terraform apply -target=aws_ecr_repository.backend -target=aws_ecr_repository.frontend -auto-approve

      - name: Login to Amazon ECR
        if: steps.deploy_config.outputs.enabled == 'true'
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: infra/aws
        run: |
          ECR_REPOSITORY_URL="$(terraform output -raw backend_ecr_repository_url)"
          cd ../..
          docker build -t "$ECR_REPOSITORY_URL:${GITHUB_SHA}" mizan-backend
          docker push "$ECR_REPOSITORY_URL:${GITHUB_SHA}"

      - name: Build and push bootstrap frontend image
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: infra/aws
        run: |
          ECR_REPOSITORY_URL="$(terraform output -raw frontend_ecr_repository_url)"
          cd ../..
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=same-origin \
            -t "$ECR_REPOSITORY_URL:${GITHUB_SHA}-bootstrap" \
            mizan-frontend
          docker push "$ECR_REPOSITORY_URL:${GITHUB_SHA}-bootstrap"

      - name: Apply AWS infrastructure
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: infra/aws
        run: terraform apply -auto-approve

      - name: Build and push final frontend image
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: infra/aws
        run: |
          BACKEND_ORIGIN="$(terraform output -raw frontend_build_backend_origin)"
          ECR_REPOSITORY_URL="$(terraform output -raw frontend_ecr_repository_url)"
          cd ../..
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=same-origin \
            --build-arg NEXT_PUBLIC_BACKEND_ORIGIN="$BACKEND_ORIGIN" \
            --build-arg NEXT_PUBLIC_WS_URL="${BACKEND_ORIGIN/https:/wss:}/api/v1/voice/realtime" \
            -t "$ECR_REPOSITORY_URL:${GITHUB_SHA}" \
            mizan-frontend
          docker push "$ECR_REPOSITORY_URL:${GITHUB_SHA}"

      - name: Deploy final frontend image
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: infra/aws
        run: |
          terraform apply -auto-approve -var="frontend_image_tag=${GITHUB_SHA}"
          CLUSTER="$(terraform output -raw ecs_cluster_name)"
          FRONTEND_SERVICE="$(terraform output -raw frontend_ecs_service_name)"
          BACKEND_SERVICE="$(terraform output -raw backend_ecs_service_name)"
          aws ecs update-service --cluster "$CLUSTER" --service "$FRONTEND_SERVICE" --force-new-deployment
          aws ecs update-service --cluster "$CLUSTER" --service "$BACKEND_SERVICE" --force-new-deployment

      - name: Invalidate frontend cache
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: infra/aws
        run: |
          DISTRIBUTION_ID="$(terraform output -raw cloudfront_distribution_id)"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

      - name: Health check
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: infra/aws
        run: |
          HEALTH_URL="$(terraform output -raw api_health_check_url)"
          echo "Checking ${HEALTH_URL} (first deploy may take several minutes for RDS + migrations)..."
          for i in $(seq 1 40); do
            if curl -fsS "$HEALTH_URL"; then
              exit 0
            fi
            echo "Attempt ${i}/40 failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Show deployment URLs
        if: steps.deploy_config.outputs.enabled == 'true'
        working-directory: infra/aws
        run: |
          echo "Frontend: $(terraform output -raw frontend_url)"
          echo "API: $(terraform output -raw api_url)"
          echo "Frontend build API: $(terraform output -raw frontend_build_api_url)"
          echo "Frontend backend origin: $(terraform output -raw frontend_build_backend_origin)"
          echo "CloudFront health: $(terraform output -raw api_health_check_url)"
          echo "ACM status: $(terraform output -raw acm_certificate_status 2>/dev/null || echo n/a)"
          echo "Custom domain ready: $(terraform output -raw custom_domain_ready 2>/dev/null || echo false)"
          echo ""
          terraform output -raw dns_setup_instructions

  destroy_aws:
    name: Destroy AWS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.aws_action == 'destroy' }}
    env:
      AWS_DEPLOY_ENABLED: ${{ secrets.AWS_DEPLOY_ENABLED }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ secrets.TF_STATE_KEY }}
      TF_STATE_REGION: ${{ secrets.TF_STATE_REGION }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'mizan' }}
      TF_VAR_environment: ${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}
      TF_VAR_frontend_image_tag: destroy-placeholder
      TF_VAR_backend_secret_key: ${{ secrets.BACKEND_SECRET_KEY }}
      TF_VAR_mistral_api_key: ${{ secrets.MISTRAL_API_KEY }}
      TF_VAR_cloudinary_cloud_name: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      TF_VAR_cloudinary_api_key: ${{ secrets.CLOUDINARY_API_KEY }}
      TF_VAR_cloudinary_api_secret: ${{ secrets.CLOUDINARY_API_SECRET }}
      TF_VAR_smtp_user: ${{ secrets.SMTP_USER }}
      TF_VAR_smtp_password: ${{ secrets.SMTP_PASSWORD }}
      APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
    steps:
      - name: Check AWS destroy configuration
        run: |
          if [ "$AWS_DEPLOY_ENABLED" != "true" ]; then
            echo "AWS_DEPLOY_ENABLED must be true to destroy AWS resources." >&2
            exit 1
          fi
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$AWS_REGION" ] || [ -z "$TF_STATE_BUCKET" ]; then
            echo "Missing AWS credentials or TF_STATE_BUCKET." >&2
            exit 1
          fi

      - name: Prepare custom domain terraform vars
        run: |
          if [ -n "$APP_PUBLIC_URL" ]; then
            DOMAIN="$(printf '%s' "$APP_PUBLIC_URL" | sed -e 's#^https://##' -e 's#^http://##' -e 's#/.*##')"
            echo "TF_VAR_app_domain=${DOMAIN}" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Create Terraform backend config
        working-directory: infra/aws
        run: |
          cat > backend_override.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF

      - name: Terraform init
        working-directory: infra/aws
        run: |
          KEY="${TF_STATE_KEY:-mizan/staging/terraform.tfstate}"
          REGION="${TF_STATE_REGION:-$AWS_REGION}"
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$KEY" \
            -backend-config="region=$REGION"

      - name: Destroy AWS infrastructure
        working-directory: infra/aws
        run: terraform destroy -auto-approve
